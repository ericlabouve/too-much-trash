name: Backend release and production deployment

on:
  push:
    branches: [main]

permissions:
  contents: read

# A running migration/rollout must never be cancelled by a newer merge.
concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [api, worker, caddy]
        include:
          - component: api
            context: backend/api
            file: backend/api/Dockerfile
          - component: worker
            context: backend/workflows
            file: backend/workflows/Dockerfile
          - component: caddy
            context: .
            file: backend/caddy/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/arm64
          push: true
          tags: ghcr.io/ericlabouve/too-much-trash-${{ matrix.component }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/ericlabouve/too-much-trash
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: CADDYFILE=Caddyfile.production
          cache-from: type=gha,scope=backend-${{ matrix.component }}
          cache-to: type=gha,scope=backend-${{ matrix.component }},mode=min
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"

  deploy:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    # This exact workflow/ref is the OIDC trust boundary. No PR trigger/checkouts.
    if: github.repository == 'ericlabouve/too-much-trash' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish complete immutable release manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 backend/ops/cd/release.py "$GITHUB_SHA" release.json
          gh release create "backend-$GITHUB_SHA" release.json --target "$GITHUB_SHA" \
            --title "Backend ${GITHUB_SHA:0:12}" --notes "Complete ARM64 backend image release; deployment result is recorded in Actions." \
            || gh release view "backend-$GITHUB_SHA" >/dev/null
          gh release download "backend-$GITHUB_SHA" --pattern release.json --dir published
          cmp release.json published/release.json
      - uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ vars.TS_DEPLOY_CLIENT_ID }}
          audience: ${{ vars.TS_DEPLOY_AUDIENCE }}
          tags: tag:tmt-deploy
          ping: erics-mac-mini.mongoose-bonito.ts.net
      - name: Deploy over private SSH
        env:
          TMT_DEPLOY_KEY: ${{ secrets.TMT_DEPLOY_SSH_KEY }}
          TMT_KNOWN_HOSTS: ${{ vars.TMT_DEPLOY_KNOWN_HOSTS }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$TMT_DEPLOY_KEY" > "$HOME/.ssh/tmt_deploy"
          chmod 600 "$HOME/.ssh/tmt_deploy"
          printf '%s\n' "$TMT_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          python3 backend/ops/cd/release.py --request release.json \
            | ssh -i "$HOME/.ssh/tmt_deploy" -o IdentitiesOnly=yes -o BatchMode=yes \
                -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
                ericlabouve@erics-mac-mini.mongoose-bonito.ts.net deploy
      - name: Report deployment result
        if: always()
        run: |
          echo "Backend release: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  verify-public:
    needs: deploy
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    # A clean runner has no VPN/MagicDNS: this proves Internet Funnel access,
    # not an accidentally permitted private tailnet route.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify public Funnel isolation from outside the tailnet
        run: python3 backend/ops/cd/check_public.py
      - name: Report public verification result
        if: always()
        run: |
          echo "Public Funnel verification: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
