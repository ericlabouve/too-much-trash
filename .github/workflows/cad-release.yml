name: CAD release packages

on:
  workflow_call:
  pull_request:
    paths:
      - 'cad/**'
      - 'backend/ops/cd/**'
      - 'backend/api/tests/test_release_versioning.py'
      - '.github/workflows/backend-cd.yaml'
      - '.github/workflows/cad-release.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify release publication and workflow routing
        run: python -m unittest discover -s backend/api/tests -p test_release_versioning.py
      - name: Install headless CAD runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1 libxrender1 libxext6 libsm6
      - name: Install uv
        run: python -m pip install 'uv==0.6.9'
      - name: Install locked CAD dependencies
        working-directory: cad
        run: uv sync --frozen
      - name: Build unsliced packages
        working-directory: cad
        run: uv run --frozen inv release --version v4 --output build/release
      - name: Verify release contents and source geometry
        working-directory: cad
        env:
          CAD_RELEASE_BUNDLE: build/release
          CAD_RELEASE_BUILD: build/release-build
        run: |
          uv run --frozen python -m unittest discover -s tests -p 'test_*release*.py'
          uv run --frozen python -m unittest discover -s tests -p test_plate_previews.py
      - name: Verify plate previews exist
        working-directory: cad/build/release
        run: |
          test -s PETG.png
          test -s TPU.png
      - name: Upload packages for verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cad-release-packages
          path: cad/build/release/
          if-no-files-found: error
          retention-days: 1
