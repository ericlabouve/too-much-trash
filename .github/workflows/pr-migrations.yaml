name: PR migration policy

on:
  pull_request:

permissions:
  contents: read

jobs:
  alembic:
    name: At most one Alembic revision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Count new revisions
        shell: bash
        run: |
          # On pull_request, HEAD is the proposed merge and its first parent is the base.
          added=$(git diff --no-renames --name-only --diff-filter=A HEAD^1 HEAD \
            -- ':(glob)backend/api/migrations/versions/*.py')
          if [[ "$added" == *$'\n'* ]]; then
            echo '::error::Add at most one new Alembic revision per pull request.'
            printf '%s\n' "$added"
            exit 1
          fi
