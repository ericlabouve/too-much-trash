<!doctype html><html><head><meta charset="utf-8"><title>Neck fit sample · 20 mm</title><style>body{margin:0;font:16px system-ui;background:#f7f5f0;color:#302e2a}header{position:absolute;top:20px;left:24px;max-width:460px}h1{font-size:24px;margin:0 0 8px}p{line-height:1.5;margin:8px 0}button{padding:10px 16px;margin:8px 8px 0 0;background:white;border:1px solid #b9b3a8;border-radius:7px;cursor:pointer}canvas{display:block}footer{position:absolute;bottom:20px;left:24px;color:#68635c}a{color:#86522b}</style><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.180.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.180.0/examples/jsm/"}}</script></head><body><header><h1>20 mm neck fit sample</h1><p>Carrier section + removable shaft cap.<br>Nominal opening: 11.6 × 17.6 mm.<br>One existing screw/nut pair joins the two ears.</p><button id="split">Separate halves</button><button id="end">Look through opening</button><p>Fit test only; full-clamp strength remains untested.<br><a href="README.md">Print and fit instructions</a> · <a href="neck_fit_pair-layers.png">Sliced layers</a></p></header><footer>Drag to rotate · scroll to zoom · right-drag to pan</footer><script type="module">
import {installViewCube} from '../../../../../view_cube.js';
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {STLLoader} from 'three/addons/loaders/STLLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#f7f5f0');const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.1,1000);camera.position.set(95,65,110);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(devicePixelRatio);document.body.append(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,10,0);controls.enableDamping=true;const viewCube=installViewCube({canvas:renderer.domElement,camera,controls});scene.add(new THREE.HemisphereLight(0xffffff,0x8d8172,2.4));const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(40,80,100);scene.add(light);const loader=new STLLoader();const meshes=[];await Promise.all(['carrier','cap'].map(async(n,i)=>{const g=await loader.loadAsync('view-'+n+'.stl');g.computeVertexNormals();const mesh=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:i?0xf9a543:0xf0802b,roughness:.7}));meshes[i]=mesh;scene.add(mesh);}));let separate=false;document.querySelector('#split').onclick=()=>{separate=!separate;meshes[0].position.x=separate?-8:0;meshes[1].position.x=separate?8:0;document.querySelector('#split').textContent=separate?'Assemble halves':'Separate halves';};document.querySelector('#end').onclick=()=>{camera.position.set(0,10,150);camera.up.set(0,1,0);controls.target.set(0,10,0);controls.update();};window.onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)};renderer.setAnimationLoop(()=>{controls.update();viewCube.tick();renderer.render(scene,viewCube.camera)});
</script></body></html>
