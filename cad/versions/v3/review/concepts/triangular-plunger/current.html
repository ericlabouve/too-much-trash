<!doctype html><html><head><meta charset="utf-8"><title>Current actuator bracket and sliding plunger</title><style>canvas{display:block}body{overflow-x:hidden}body{margin:0;font:16px system-ui;color:#23383e;background:#f7f7f3}header{padding:18px 26px}h1{margin:0 0 8px}p{max-width:1000px;margin:8px 0}button,a{padding:8px 14px;margin-right:8px;cursor:pointer}#view{height:70vh;min-height:450px}footer{padding:15px 26px}</style><script type="importmap">{"imports":{"three":"/vendor/three/three.module.js","three/addons/":"/vendor/three/addons/"}}</script></head><body><header><h1>Current actuator bracket + sliding plunger</h1><p>Orange: bracket · teal: plunger. Both currently not approved.</p><button id="alone">Current parts</button><button id="front">Top view</button><a href="./">Compare three triangular guides</a></header><div id="view"></div><footer><p>Existing V3 geometry, shown together at their current alignment. New concepts have not replaced these parts.</p><p id="error" style="color:red"></p></footer><script>window.addEventListener("error",e=>{if(!e.message.includes("ResizeObserver"))document.querySelector("#error").textContent=e.message});window.addEventListener("unhandledrejection",e=>document.querySelector("#error").textContent=String(e.reason));</script><script type="module">
import * as T from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{STLLoader}from'three/addons/loaders/STLLoader.js';
const el=document.querySelector('#view'),scene=new T.Scene();scene.background=new T.Color('#f7f7f3');const camera=new T.PerspectiveCamera(35,1,.1,1000);const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(devicePixelRatio);el.append(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);scene.add(new T.HemisphereLight(0xffffff,0x777777,2.5));const light=new T.DirectionalLight(0xffffff,3);light.position.set(40,70,80);scene.add(light);const group=new T.Group();scene.add(group);const loader=new STLLoader();let mode='alone';
async function mesh(file,color,opacity=1){const g=await loader.loadAsync(file);g.computeVertexNormals();return new T.Mesh(g,new T.MeshStandardMaterial({color,roughness:.65,transparent:opacity<1,opacity,side:T.DoubleSide}));}
function frame(){const b=new T.Box3().setFromObject(group),c=b.getCenter(new T.Vector3()),size=b.getSize(new T.Vector3()).length();controls.target.copy(c);camera.position.copy(c).add(new T.Vector3(size*1.5,size*.4,size*.9));camera.lookAt(c);controls.update();}
async function show(m){group.clear();group.add(await mesh('../../actuator_bracket.stl',0xffa247));group.add(await mesh('../../plunger.stl',0x00aabb));frame();camera.up.set(0,0,1);controls.update();}
document.querySelector('#alone').onclick=()=>show('alone');document.querySelector('#front').onclick=()=>{const c=controls.target;camera.position.copy(c).add(new T.Vector3(0,0,85));camera.up.set(0,1,0);controls.update();};new ResizeObserver(()=>{renderer.setSize(el.clientWidth,el.clientHeight);camera.aspect=el.clientWidth/el.clientHeight;camera.updateProjectionMatrix();}).observe(el);renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});await show('alone');
</script></body></html>
