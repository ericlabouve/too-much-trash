<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1190" viewBox="0 0 1400 1190"><defs><marker id="motion" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#238872" stroke-width="1.8"/></marker><marker id="pull" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#9261aa" stroke-width="1.8"/></marker></defs><rect width="1400" height="1190" fill="#f7f8f7"/><g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><text x="30" y="43" font-size="31" fill="#263a44" font-weight="700">Four ways to press the volume button</text><text x="30" y="74" font-size="18" fill="#33454e" >Concept sketches · button motion is DOWN in every panel · exaggerated gaps and travel · not to scale</text><rect x="32" y="93" width="20" height="13" rx="3" fill="#f6b359" stroke="#b57128" stroke-width="2.5"/><text x="61" y="105" font-size="15" fill="#33454e" >Moving printed parts</text><rect x="256" y="93" width="20" height="13" rx="3" fill="#e2e8eb" stroke="#7d8d96" stroke-width="2.5"/><text x="285" y="105" font-size="15" fill="#33454e" >Fixed frame / guides</text><line x1="486" y1="99" x2="516" y2="99" stroke="#9261aa" stroke-width="4" /><text x="526" y="105" font-size="15" fill="#33454e" >Twine / pull</text><line x1="696" y1="99" x2="730" y2="99" stroke="#238872" stroke-width="4" marker-end="url(#motion)"/><text x="742" y="105" font-size="15" fill="#33454e" >Output motion</text><g transform="translate(24,133)"><rect x="0" y="0" width="664" height="502" rx="14" fill="#fff" stroke="#dce3e7" stroke-width="2.5"/><text x="24" y="40" font-size="26" fill="#c77929" font-weight="700">A</text><text x="64" y="39" font-size="23" fill="#263a44" font-weight="650">Twine-driven sliding plunger</text><text x="25" y="69" font-size="16" fill="#33454e" >Redirect the pull; the contact shoe only slides.</text><rect x="241" y="246" width="12" height="54" rx="3" fill="#e2e8eb" stroke="#7d8d96" stroke-width="2.5"/><rect x="287" y="246" width="12" height="54" rx="3" fill="#e2e8eb" stroke="#7d8d96" stroke-width="2.5"/><rect x="257" y="186" width="26" height="128" rx="3" fill="#f6b359" stroke="#b57128" stroke-width="2.5"/><rect x="227" y="310" width="86" height="14" rx="3" fill="#f6b359" stroke="#b57128" stroke-width="2.5"/><rect x="257" y="191" width="109" height="17" rx="3" fill="#f6b359" stroke="#b57128" stroke-width="2.5"/><line x1="365" y1="208" x2="365" y2="270" stroke="#9261aa" stroke-width="4" /><circle cx="390" cy="270" r="25" fill="#e2e8eb" stroke="#7d8d96" stroke-width="3"/><circle cx="390" cy="270" r="5" fill="#7d8d96"/><path d="M365 245 L365 270 A25 25 0 0 0 390 295 L544 295" fill="none" stroke="#9261aa" stroke-width="4"/><line x1="458" y1="295" x2="558" y2="295" stroke="#9261aa" stroke-width="4" marker-end="url(#pull)"/><text x="469" y="280" font-size="16" fill="#9261aa" >PULL</text><line x1="270" y1="135" x2="270" y2="186" stroke="#9261aa" stroke-width="3" /><text x="160" y="128" font-size="16" fill="#9261aa" >return band ↑</text><rect x="252" y="125" width="36" height="10" rx="3" fill="#e2e8eb" stroke="#7d8d96" stroke-width="2.5"/><text x="390" y="220" font-size="16" fill="#33454e" >fixed pulley</text><line x1="415" y1="224" x2="402" y2="247" stroke="#88979f" stroke-width="1.5" /><text x="88" y="259" font-size="16" fill="#33454e" >slide guides</text><line x1="190" y1="255" x2="234" y2="264" stroke="#88979f" stroke-width="1.5" /><line x1="320" y1="316" x2="320" y2="341" stroke="#238872" stroke-width="4" marker-end="url(#motion)"/><rect x="148" y="354" width="244" height="40" rx="7" fill="#edf0f2" stroke="#88979f" stroke-width="2.5"/><rect x="247" y="343" width="46" height="11" rx="3" fill="#a9b7bf" stroke="#647782" stroke-width="2.5"/><text x="270" y="382" font-size="15" fill="#677a84" text-anchor="middle">PHONE</text><text x="409" y="353" font-size="15" fill="#33454e" >button</text><line x1="396" y1="349" x2="299" y2="349" stroke="#88979f" stroke-width="1.5" /><text x="25" y="471" font-size="16" fill="#33454e" >A guide prevents rotation; cord routing must avoid tipping the slider.</text> </g><g transform="translate(712,133)"><rect x="0" y="0" width="664" height="502" rx="14" fill="#fff" stroke="#dce3e7" stroke-width="2.5"/><text x="24" y="40" font-size="26" fill="#c77929" font-weight="700">B</text><text x="64" y="39" font-size="23" fill="#263a44" font-weight="650">Sliding wedge + plunger</text><text x="25" y="69" font-size="16" fill="#33454e" >A sideways ramp pushes the contact shoe downward.</text><rect x="126" y="175" width="219" height="12" rx="3" fill="#e2e8eb" stroke="#7d8d96" stroke-width="2.5"/><path d="M142 195 L345 195 L142 285 Z" fill="#f6b359" stroke="#b57128" stroke-width="2.5"/><line x1="345" y1="202" x2="540" y2="202" stroke="#9261aa" stroke-width="4" /><line x1="427" y1="202" x2="552" y2="202" stroke="#9261aa" stroke-width="4" marker-end="url(#pull)"/><text x="446" y="184" font-size="16" fill="#9261aa" >PULL</text><rect x="241" y="246" width="12" height="54" rx="3" fill="#e2e8eb" stroke="#7d8d96" stroke-width="2.5"/><rect x="287" y="246" width="12" height="54" rx="3" fill="#e2e8eb" stroke="#7d8d96" stroke-width="2.5"/><rect x="257" y="240" width="26" height="74" rx="3" fill="#f6b359" stroke="#b57128" stroke-width="2.5"/><rect x="227" y="310" width="86" height="14" rx="3" fill="#f6b359" stroke="#b57128" stroke-width="2.5"/><circle cx="270" cy="240" r="10" fill="#f6b359" stroke="#b57128" stroke-width="2.5"/><text x="371" y="252" font-size="16" fill="#33454e" >ramp contacts</text><text x="371" y="273" font-size="16" fill="#33454e" >the follower</text><line x1="362" y1="254" x2="284" y2="236" stroke="#88979f" stroke-width="1.5" /><line x1="319" y1="312" x2="319" y2="339" stroke="#238872" stroke-width="4" marker-end="url(#motion)"/><rect x="148" y="354" width="244" height="40" rx="7" fill="#edf0f2" stroke="#88979f" stroke-width="2.5"/><rect x="247" y="343" width="46" height="11" rx="3" fill="#a9b7bf" stroke="#647782" stroke-width="2.5"/><text x="270" y="382" font-size="15" fill="#677a84" text-anchor="middle">PHONE</text><text x="409" y="353" font-size="15" fill="#33454e" >button</text><line x1="396" y1="349" x2="299" y2="349" stroke="#88979f" stroke-width="1.5" /><text x="82" y="307" font-size="16" fill="#9261aa" >↑ return band</text><text x="25" y="471" font-size="16" fill="#33454e" >Ramp angle sets the travel ratio; sliding friction can resist return.</text> </g><g transform="translate(24,657)"><rect x="0" y="0" width="664" height="502" rx="14" fill="#fff" stroke="#dce3e7" stroke-width="2.5"/><text x="24" y="40" font-size="26" fill="#c77929" font-weight="700">C</text><text x="64" y="39" font-size="23" fill="#263a44" font-weight="650">Flexure-guided plunger</text><text x="25" y="69" font-size="16" fill="#33454e" >Thin beams bend; there is no rubbing slider joint.</text><rect x="125" y="157" width="28" height="119" rx="3" fill="#e2e8eb" stroke="#7d8d96" stroke-width="2.5"/><rect x="153" y="174" width="166" height="7" rx="3" fill="#f6b359" stroke="#b57128" stroke-width="2.5"/><rect x="153" y="248" width="166" height="7" rx="3" fill="#f6b359" stroke="#b57128" stroke-width="2.5"/><rect x="310" y="169" width="29" height="110" rx="3" fill="#f6b359" stroke="#b57128" stroke-width="2.5"/><path d="M153 178 C213 178 251 196 310 196 M153 252 C213 252 251 270 310 270" stroke="#c88c45" stroke-width="2" stroke-dasharray="6 6" fill="none"/><rect x="312" y="279" width="24" height="35" rx="3" fill="#f6b359" stroke="#b57128" stroke-width="2.5"/><rect x="281" y="310" width="86" height="14" rx="3" fill="#f6b359" stroke="#b57128" stroke-width="2.5"/><text x="152" y="130" font-size="16" fill="#33454e" >two flexible beams</text><line x1="234" y1="138" x2="235" y2="171" stroke="#88979f" stroke-width="1.5" /><line x1="338" y1="254" x2="408" y2="254" stroke="#9261aa" stroke-width="3" /><line x1="408" y1="254" x2="408" y2="320" stroke="#9261aa" stroke-width="3" /><line x1="408" y1="279" x2="408" y2="332" stroke="#9261aa" stroke-width="4" marker-end="url(#pull)"/><text x="437" y="288" font-size="16" fill="#9261aa" >redirected</text><text x="437" y="309" font-size="16" fill="#9261aa" >twine pull</text><line x1="375" y1="319" x2="375" y2="342" stroke="#238872" stroke-width="4" marker-end="url(#motion)"/><rect x="202" y="354" width="244" height="40" rx="7" fill="#edf0f2" stroke="#88979f" stroke-width="2.5"/><rect x="301" y="343" width="46" height="11" rx="3" fill="#a9b7bf" stroke="#647782" stroke-width="2.5"/><text x="324" y="382" font-size="15" fill="#677a84" text-anchor="middle">PHONE</text><text x="463" y="353" font-size="15" fill="#33454e" >button</text><line x1="450" y1="349" x2="353" y2="349" stroke="#88979f" stroke-width="1.5" /><text x="30" y="316" font-size="15" fill="#9261aa" >Beams spring back</text><text x="30" y="337" font-size="15" fill="#9261aa" >on release</text><text x="25" y="471" font-size="16" fill="#33454e" >Approximately straight motion; flexure strain and fatigue need testing.</text> </g><g transform="translate(712,657)"><rect x="0" y="0" width="664" height="502" rx="14" fill="#fff" stroke="#dce3e7" stroke-width="2.5"/><text x="24" y="40" font-size="26" fill="#c77929" font-weight="700">D</text><text x="64" y="39" font-size="23" fill="#263a44" font-weight="650">Rocker driving a plunger</text><text x="25" y="69" font-size="16" fill="#33454e" >The lever rotates; a separate contact shoe only slides.</text><rect x="284" y="246" width="12" height="54" rx="3" fill="#e2e8eb" stroke="#7d8d96" stroke-width="2.5"/><rect x="330" y="246" width="12" height="54" rx="3" fill="#e2e8eb" stroke="#7d8d96" stroke-width="2.5"/><rect x="300" y="218" width="26" height="96" rx="3" fill="#f6b359" stroke="#b57128" stroke-width="2.5"/><rect x="270" y="310" width="86" height="14" rx="3" fill="#f6b359" stroke="#b57128" stroke-width="2.5"/><rect x="287" y="211" width="54" height="12" rx="3" fill="#f6b359" stroke="#b57128" stroke-width="2.5"/><path d="M207 275 L207 183 L310 183" fill="none" stroke="#b57128" stroke-width="20"/><path d="M207 275 L207 183 L310 183" fill="none" stroke="#f6b359" stroke-width="15"/><circle cx="207" cy="183" r="12" fill="#e2e8eb" stroke="#7d8d96" stroke-width="3"/><circle cx="310" cy="199" r="10" fill="#f6b359" stroke="#b57128" stroke-width="2.5"/><line x1="207" y1="274" x2="62" y2="274" stroke="#9261aa" stroke-width="4" /><line x1="139" y1="274" x2="54" y2="274" stroke="#9261aa" stroke-width="4" marker-end="url(#pull)"/><text x="64" y="255" font-size="16" fill="#9261aa" >PULL</text><path d="M241 143 A51 51 0 0 1 258 178" fill="none" stroke="#238872" stroke-width="3" marker-end="url(#motion)"/><text x="108" y="145" font-size="16" fill="#33454e" >fixed pivot</text><line x1="190" y1="149" x2="202" y2="169" stroke="#88979f" stroke-width="1.5" /><text x="366" y="205" font-size="16" fill="#33454e" >lever pushes</text><text x="366" y="226" font-size="16" fill="#33454e" >slider head</text><line x1="357" y1="218" x2="344" y2="218" stroke="#88979f" stroke-width="1.5" /><line x1="365" y1="314" x2="365" y2="340" stroke="#238872" stroke-width="4" marker-end="url(#motion)"/><rect x="191" y="354" width="244" height="40" rx="7" fill="#edf0f2" stroke="#88979f" stroke-width="2.5"/><rect x="290" y="343" width="46" height="11" rx="3" fill="#a9b7bf" stroke="#647782" stroke-width="2.5"/><text x="313" y="382" font-size="15" fill="#677a84" text-anchor="middle">PHONE</text><text x="452" y="353" font-size="15" fill="#33454e" >button</text><line x1="439" y1="349" x2="342" y2="349" stroke="#88979f" stroke-width="1.5" /><text x="30" y="316" font-size="15" fill="#9261aa" >Return band</text><text x="30" y="337" font-size="15" fill="#9261aa" >retracts the slider</text><text x="25" y="471" font-size="16" fill="#33454e" >Keeps lever action, but removes the contact shoe’s sweeping arc.</text> </g><text x="32" y="1181" font-size="16" fill="#33454e" >All concepts still need a travel stop and a way to absorb excess trigger pull. Return-band routing is schematic.</text></g></svg>