<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1260" viewBox="0 0 1440 1260"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="1440" height="1260" fill="#f4f6f7"/><g font-family="Arial,Helvetica,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="30" y="46" font-size="32" fill="#263747" font-weight="700">Option A evolved: four compact plunger concepts</text><text x="30" y="79" font-size="18" fill="#263747" font-weight="400">Schematic side projections • press downward • gaps exaggerated • cord and pulley may sit ahead of the slider in depth</text><text x="30" y="111" font-size="18" fill="#263747" font-weight="400">Orange: printed parts (dark = fixed)     Purple: twine     Green: output motion     No rubber-band return in these sketches</text><g transform="translate(25,134)"><rect x="0" y="0" width="680" height="500" rx="12" fill="#fff" stroke="#d8e0e5"/><text x="25" y="38" font-size="25" fill="#263747" font-weight="700">A1  Centered pull + rotating pulley</text><text x="25" y="68" font-size="18" fill="#263747" font-weight="400">Best starting point for testing button-only return.</text><rect x="218" y="135" width="24" height="193" rx="3" fill="#ffc782" stroke="#9b4a16" stroke-width="2"/><rect x="200" y="168" width="14" height="22" rx="3" fill="#d97127" stroke="#9b4a16" stroke-width="2"/><rect x="246" y="168" width="14" height="22" rx="3" fill="#d97127" stroke="#9b4a16" stroke-width="2"/><rect x="200" y="214" width="14" height="22" rx="3" fill="#d97127" stroke="#9b4a16" stroke-width="2"/><rect x="246" y="214" width="14" height="22" rx="3" fill="#d97127" stroke="#9b4a16" stroke-width="2"/><rect x="193" y="310" width="74" height="12" rx="3" fill="#ffc782" stroke="#9b4a16" stroke-width="2"/><rect x="190" y="335" width="24" height="10" rx="3" fill="#d97127" stroke="#9b4a16" stroke-width="2"/><rect x="246" y="335" width="24" height="10" rx="3" fill="#d97127" stroke="#9b4a16" stroke-width="2"/><rect x="218" y="322" width="24" height="31" rx="3" fill="#ffc782" stroke="#9b4a16" stroke-width="2"/><rect x="125" y="367" width="290" height="35" rx="7" fill="#e4e9ed" stroke="#8394a1" stroke-width="2"/><rect x="213" y="354" width="34" height="13" rx="4" fill="#a0adb7"/><text x="279" y="391" font-size="16" fill="#263747" font-weight="400">PHONE</text><path d="M290 320 V351" fill="none" stroke="#19816c" stroke-width="4" marker-end="url(#arrow)"/><text x="310" y="340" font-size="15" fill="#19816c" font-weight="400">PRESS</text><text x="30" y="340" font-size="16" fill="#263747" font-weight="400">frame stop</text><path d="M117 335 H181" fill="none" stroke="#647583" stroke-width="1.5"/><text x="30" y="386" font-size="16" fill="#263747" font-weight="400">button</text><path d="M91 380 L204 360" fill="none" stroke="#647583" stroke-width="1.5"/><circle cx="250" cy="247" r="20" fill="#e9904f" stroke="#9b4a16" stroke-width="2"/><circle cx="250" cy="247" r="4" fill="#9b4a16"/><path d="M230 144 V247 A20 20 0 0 0 250 267 H537" fill="none" stroke="#7754a6" stroke-width="4" marker-end="url(#arrow)"/><text x="443" y="248" font-size="15" fill="#7754a6" font-weight="400">TWINE PULL</text><circle cx="230" cy="144" r="5" fill="#7754a6"/><text x="337" y="172" font-size="17" fill="#263747" font-weight="400">Centered attachment</text><path d="M325 169 L238 148" fill="none" stroke="#647583" stroke-width="1.5"/><text x="337" y="202" font-size="17" fill="#263747" font-weight="400">Two short guide lands</text><path d="M325 206 L268 222" fill="none" stroke="#647583" stroke-width="1.5"/><text x="337" y="292" font-size="17" fill="#263747" font-weight="400">Fixed-axis pulley</text><text x="337" y="314" font-size="16" fill="#263747" font-weight="400">in front of slider</text><text x="30" y="113" font-size="16" fill="#596b78" font-weight="400">No added return spring</text><text x="25" y="443" font-size="18" fill="#263747" font-weight="700">One slider + one wheel + captive printed axle.</text><text x="25" y="473" font-size="17" fill="#263747" font-weight="400">Less cord rubbing; axle friction and print fit still matter.</text></g><g transform="translate(735,134)"><rect x="0" y="0" width="680" height="500" rx="12" fill="#fff" stroke="#d8e0e5"/><text x="25" y="38" font-size="25" fill="#263747" font-weight="700">A2  Centered pull + fixed curved eye</text><text x="25" y="68" font-size="18" fill="#263747" font-weight="400">Fewest parts; most compact routing candidate.</text><rect x="218" y="135" width="24" height="193" rx="3" fill="#ffc782" stroke="#9b4a16" stroke-width="2"/><rect x="200" y="168" width="14" height="22" rx="3" fill="#d97127" stroke="#9b4a16" stroke-width="2"/><rect x="246" y="168" width="14" height="22" rx="3" fill="#d97127" stroke="#9b4a16" stroke-width="2"/><rect x="200" y="214" width="14" height="22" rx="3" fill="#d97127" stroke="#9b4a16" stroke-width="2"/><rect x="246" y="214" width="14" height="22" rx="3" fill="#d97127" stroke="#9b4a16" stroke-width="2"/><rect x="193" y="310" width="74" height="12" rx="3" fill="#ffc782" stroke="#9b4a16" stroke-width="2"/><rect x="190" y="335" width="24" height="10" rx="3" fill="#d97127" stroke="#9b4a16" stroke-width="2"/><rect x="246" y="335" width="24" height="10" rx="3" fill="#d97127" stroke="#9b4a16" stroke-width="2"/><rect x="218" y="322" width="24" height="31" rx="3" fill="#ffc782" stroke="#9b4a16" stroke-width="2"/><rect x="125" y="367" width="290" height="35" rx="7" fill="#e4e9ed" stroke="#8394a1" stroke-width="2"/><rect x="213" y="354" width="34" height="13" rx="4" fill="#a0adb7"/><text x="279" y="391" font-size="16" fill="#263747" font-weight="400">PHONE</text><path d="M290 320 V351" fill="none" stroke="#19816c" stroke-width="4" marker-end="url(#arrow)"/><text x="310" y="340" font-size="15" fill="#19816c" font-weight="400">PRESS</text><text x="30" y="340" font-size="16" fill="#263747" font-weight="400">frame stop</text><path d="M117 335 H181" fill="none" stroke="#647583" stroke-width="1.5"/><text x="30" y="386" font-size="16" fill="#263747" font-weight="400">button</text><path d="M91 380 L204 360" fill="none" stroke="#647583" stroke-width="1.5"/><path d="M230 247 A20 20 0 0 0 250 267 L265 267 L265 232 L230 232 Z" fill="#d97127" stroke="#9b4a16" stroke-width="2"/><path d="M230 144 V247 A20 20 0 0 0 250 267 H537" fill="none" stroke="#7754a6" stroke-width="4" marker-end="url(#arrow)"/><text x="443" y="248" font-size="15" fill="#7754a6" font-weight="400">TWINE PULL</text><circle cx="230" cy="144" r="5" fill="#7754a6"/><text x="337" y="172" font-size="17" fill="#263747" font-weight="400">Centered attachment</text><path d="M325 169 L238 148" fill="none" stroke="#647583" stroke-width="1.5"/><text x="337" y="202" font-size="17" fill="#263747" font-weight="400">Two short guide lands</text><path d="M325 206 L268 222" fill="none" stroke="#647583" stroke-width="1.5"/><text x="337" y="292" font-size="17" fill="#263747" font-weight="400">Fixed eye</text><text x="337" y="314" font-size="16" fill="#263747" font-weight="400">in front of slider</text><text x="30" y="113" font-size="16" fill="#596b78" font-weight="400">No added return spring</text><text x="25" y="443" font-size="18" fill="#263747" font-weight="700">One slider; rounded cord guide integral with frame.</text><text x="25" y="473" font-size="17" fill="#263747" font-weight="400">Sliding twine friction makes button-only return harder.</text></g><g transform="translate(25,654)"><rect x="0" y="0" width="680" height="500" rx="12" fill="#fff" stroke="#d8e0e5"/><text x="25" y="38" font-size="25" fill="#263747" font-weight="700">A3  Moving pulley + guided plunger</text><text x="25" y="68" font-size="18" fill="#263747" font-weight="400">2:1 input travel / output travel; two wheels total.</text><rect x="218" y="192" width="24" height="136" rx="3" fill="#ffc782" stroke="#9b4a16" stroke-width="2"/><rect x="200" y="220" width="14" height="22" rx="3" fill="#d97127" stroke="#9b4a16" stroke-width="2"/><rect x="246" y="220" width="14" height="22" rx="3" fill="#d97127" stroke="#9b4a16" stroke-width="2"/><rect x="200" y="266" width="14" height="22" rx="3" fill="#d97127" stroke="#9b4a16" stroke-width="2"/><rect x="246" y="266" width="14" height="22" rx="3" fill="#d97127" stroke="#9b4a16" stroke-width="2"/><rect x="193" y="310" width="74" height="12" rx="3" fill="#ffc782" stroke="#9b4a16" stroke-width="2"/><rect x="190" y="335" width="24" height="10" rx="3" fill="#d97127" stroke="#9b4a16" stroke-width="2"/><rect x="246" y="335" width="24" height="10" rx="3" fill="#d97127" stroke="#9b4a16" stroke-width="2"/><rect x="218" y="322" width="24" height="31" rx="3" fill="#ffc782" stroke="#9b4a16" stroke-width="2"/><rect x="125" y="367" width="290" height="35" rx="7" fill="#e4e9ed" stroke="#8394a1" stroke-width="2"/><rect x="213" y="354" width="34" height="13" rx="4" fill="#a0adb7"/><text x="279" y="391" font-size="16" fill="#263747" font-weight="400">PHONE</text><path d="M290 320 V351" fill="none" stroke="#19816c" stroke-width="4" marker-end="url(#arrow)"/><text x="310" y="340" font-size="15" fill="#19816c" font-weight="400">PRESS</text><text x="30" y="340" font-size="16" fill="#263747" font-weight="400">frame stop</text><path d="M117 335 H181" fill="none" stroke="#647583" stroke-width="1.5"/><text x="30" y="386" font-size="16" fill="#263747" font-weight="400">button</text><path d="M91 380 L204 360" fill="none" stroke="#647583" stroke-width="1.5"/><circle cx="230" cy="172" r="20" fill="#ffc782" stroke="#9b4a16" stroke-width="2"/><circle cx="230" cy="172" r="4" fill="#9b4a16"/><circle cx="270" cy="274" r="20" fill="#e9904f" stroke="#9b4a16" stroke-width="2"/><circle cx="270" cy="274" r="4" fill="#9b4a16"/><rect x="198" y="280" width="24" height="10" rx="3" fill="#d97127" stroke="#9b4a16" stroke-width="2"/><path d="M210 280 V172 A20 20 0 0 1 250 172 V274 A20 20 0 0 0 270 294 H537" fill="none" stroke="#7754a6" stroke-width="4" marker-end="url(#arrow)"/><text x="431" y="275" font-size="15" fill="#7754a6" font-weight="400">TWINE PULL</text><text x="325" y="145" font-size="17" fill="#263747" font-weight="400">Pulley rides on slider</text><path d="M316 149 L253 167" fill="none" stroke="#647583" stroke-width="1.5"/><text x="27" y="261" font-size="16" fill="#263747" font-weight="400">Fixed end</text><path d="M109 260 L201 281" fill="none" stroke="#647583" stroke-width="1.5"/><text x="340" y="212" font-size="18" fill="#263747" font-weight="400">Pull 2 units</text><text x="340" y="237" font-size="18" fill="#263747" font-weight="400">Press 1 unit (ideal)</text><text x="25" y="443" font-size="18" fill="#263747" font-weight="700">Half the stroke, about twice the output force (ideal).</text><text x="25" y="473" font-size="17" fill="#263747" font-weight="400">More friction and depth; button must back-drive the tackle.</text></g><g transform="translate(735,654)"><rect x="0" y="0" width="680" height="500" rx="12" fill="#fff" stroke="#d8e0e5"/><text x="25" y="38" font-size="25" fill="#263747" font-weight="700">A4  A1 + light printed return leaves</text><text x="25" y="68" font-size="18" fill="#263747" font-weight="400">Slider stays rigid; replaceable leaves help it retract.</text><rect x="218" y="135" width="24" height="193" rx="3" fill="#ffc782" stroke="#9b4a16" stroke-width="2"/><rect x="200" y="168" width="14" height="22" rx="3" fill="#d97127" stroke="#9b4a16" stroke-width="2"/><rect x="246" y="168" width="14" height="22" rx="3" fill="#d97127" stroke="#9b4a16" stroke-width="2"/><rect x="200" y="214" width="14" height="22" rx="3" fill="#d97127" stroke="#9b4a16" stroke-width="2"/><rect x="246" y="214" width="14" height="22" rx="3" fill="#d97127" stroke="#9b4a16" stroke-width="2"/><rect x="193" y="310" width="74" height="12" rx="3" fill="#ffc782" stroke="#9b4a16" stroke-width="2"/><rect x="190" y="335" width="24" height="10" rx="3" fill="#d97127" stroke="#9b4a16" stroke-width="2"/><rect x="246" y="335" width="24" height="10" rx="3" fill="#d97127" stroke="#9b4a16" stroke-width="2"/><rect x="218" y="322" width="24" height="31" rx="3" fill="#ffc782" stroke="#9b4a16" stroke-width="2"/><rect x="125" y="367" width="290" height="35" rx="7" fill="#e4e9ed" stroke="#8394a1" stroke-width="2"/><rect x="213" y="354" width="34" height="13" rx="4" fill="#a0adb7"/><text x="279" y="391" font-size="16" fill="#263747" font-weight="400">PHONE</text><path d="M290 320 V351" fill="none" stroke="#19816c" stroke-width="4" marker-end="url(#arrow)"/><text x="310" y="340" font-size="15" fill="#19816c" font-weight="400">PRESS</text><text x="30" y="340" font-size="16" fill="#263747" font-weight="400">frame stop</text><path d="M117 335 H181" fill="none" stroke="#647583" stroke-width="1.5"/><text x="30" y="386" font-size="16" fill="#263747" font-weight="400">button</text><path d="M91 380 L204 360" fill="none" stroke="#647583" stroke-width="1.5"/><circle cx="250" cy="247" r="20" fill="#e9904f" stroke="#9b4a16" stroke-width="2"/><circle cx="250" cy="247" r="4" fill="#9b4a16"/><path d="M230 144 V247 A20 20 0 0 0 250 267 H537" fill="none" stroke="#7754a6" stroke-width="4" marker-end="url(#arrow)"/><text x="443" y="248" font-size="15" fill="#7754a6" font-weight="400">TWINE PULL</text><circle cx="230" cy="144" r="5" fill="#7754a6"/><text x="337" y="172" font-size="17" fill="#263747" font-weight="400">Centered attachment</text><path d="M325 169 L238 148" fill="none" stroke="#647583" stroke-width="1.5"/><text x="337" y="202" font-size="17" fill="#263747" font-weight="400">Two short guide lands</text><path d="M325 206 L268 222" fill="none" stroke="#647583" stroke-width="1.5"/><text x="337" y="292" font-size="17" fill="#263747" font-weight="400">Fixed-axis pulley</text><text x="337" y="314" font-size="16" fill="#263747" font-weight="400">in front of slider</text><rect x="126" y="91" width="14" height="28" rx="3" fill="#d97127" stroke="#9b4a16" stroke-width="2"/><rect x="320" y="91" width="14" height="28" rx="3" fill="#d97127" stroke="#9b4a16" stroke-width="2"/><path d="M140 105 C176 105 181 142 218 142 M320 105 C284 105 279 142 242 142" fill="none" stroke="#d97127" stroke-width="5"/><text x="356" y="114" font-size="16" fill="#263747" font-weight="400">Paired printed leaves</text><path d="M349 110 H338" fill="none" stroke="#647583" stroke-width="1.5"/><text x="25" y="443" font-size="18" fill="#263747" font-weight="700">No rubber band; restores a small gap after release.</text><text x="25" y="473" font-size="17" fill="#263747" font-weight="400">Leaf stiffness, PLA creep and fatigue need qualification.</text></g><text x="30" y="1190" font-size="19" fill="#263747" font-weight="700">All four: frame-referenced press stop + settable button gap + a separate excess-pull provision at the trigger or input.</text><text x="30" y="1222" font-size="18" fill="#263747" font-weight="400">Button-only return can restore button height, not an air gap. A stop limits displacement; it does not absorb continuing trigger travel.</text><text x="30" y="1247" font-size="16" fill="#596b78" font-weight="400">Research concepts • 2026-10-07 • unscaled and unvalidated • current V3 rocker CAD remains unchanged</text></g></svg>