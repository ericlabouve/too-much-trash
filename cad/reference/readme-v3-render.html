<!doctype html><html><head><meta charset="utf-8"><title>V3 complete assembly render</title><style>html,body{margin:0;background:#f8f7f3;font-family:system-ui;color:#243138;height:100%}header{position:absolute;top:24px;left:28px;z-index:2}h1{font-size:24px;margin:0}p{font-size:14px;margin:6px 0}main{display:flex;height:100vh}.pane{height:100%;width:38%}.pane:last-child{width:62%}canvas{width:100%;height:100%;display:block}footer{position:absolute;bottom:18px;left:28px;font-size:13px}</style><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.180.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.180.0/examples/jsm/"}}</script></head><body><header><h1>V3 · Complete reacher retrofit</h1><p>Full tool and phone-mount detail · CAD fit prototype</p></header><main><div class="pane"><canvas></canvas></div><div class="pane"><canvas></canvas></div></main><footer>Orange: rigid printed parts · Cyan: TPU parts · Blue: stock handle/brace · Purple: rubber bands</footer><script type="module">
import * as T from 'three';import {STLLoader} from 'three/addons/loaders/STLLoader.js';
const base='../versions/v3/review/bare-near/',manifest=await(await fetch(base+'manifest.json',{cache:'no-store'})).json(),loader=new STLLoader(),back=new URLSearchParams(location.search).get('side')==='back';
const excluded=['actuator_context','stock_neck_context','twine_phone','phone_camera_keepout','camera_keepout'];
const parts=await Promise.all(manifest.assembly.filter(e=>!excluded.includes(e.name)).map(async e=>({e,g:await loader.loadAsync(base+e.file+'?r='+manifest.revision)})));
for(const [i,canvas] of [...document.querySelectorAll('canvas')].entries()){
 const r=new T.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});r.setPixelRatio(2);r.setSize(canvas.clientWidth,canvas.clientHeight,false);r.setClearColor(0xf8f7f3);
 const scene=new T.Scene();scene.add(new T.HemisphereLight(0xffffff,0x8d9698,2.6));const light=new T.DirectionalLight(0xffffff,3);light.position.set(-150,250,180);scene.add(light);const root=new T.Group();root.rotation.x=-Math.PI/2;scene.add(root);
 for(const {e,g} of parts){if(i===1&&(e.name.startsWith('stock_')||e.name==='twine'||e.name==='twine_trigger'||e.name==='band_overtravel'||e.name==='guide_1'))continue;const m=new T.Mesh(g,new T.MeshStandardMaterial({color:new T.Color(...e.color),roughness:.7}));root.add(m)}
 root.updateMatrixWorld(true);const box=new T.Box3().setFromObject(root),center=box.getCenter(new T.Vector3()),dir=new T.Vector3(back?.9:-.7,back?-.85:.85,back?.6:1).normalize();
 const cam=new T.OrthographicCamera(-1,1,1,-1,.1,4000);cam.position.copy(center).addScaledVector(dir,1600);cam.lookAt(center);cam.updateMatrixWorld();let minx=Infinity,maxx=-Infinity,miny=Infinity,maxy=-Infinity;
 for(const x of [box.min.x,box.max.x])for(const y of [box.min.y,box.max.y])for(const z of [box.min.z,box.max.z]){const p=new T.Vector3(x,y,z).applyMatrix4(cam.matrixWorldInverse);minx=Math.min(minx,p.x);maxx=Math.max(maxx,p.x);miny=Math.min(miny,p.y);maxy=Math.max(maxy,p.y)}
 const aspect=canvas.clientWidth/canvas.clientHeight,h=Math.max(maxy-miny,(maxx-minx)/aspect)*1.16;cam.left=-h*aspect/2;cam.right=h*aspect/2;cam.top=h/2;cam.bottom=-h/2;cam.updateProjectionMatrix();r.render(scene,cam);
}document.body.dataset.ready='true';
</script></body></html>
