<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Too Much Trash — R4 CAD and STL review</title>
<style>body{margin:0;font:15px system-ui;color:#23303b;background:#f4f5f7}header{padding:18px 24px;background:white;border-bottom:1px solid #d9dfe3}h1{font-size:22px;margin:0 0 7px}p{margin:4px 0;color:#586674}button,a{font:inherit}button{padding:8px 13px;margin:9px 6px 0 0;border:1px solid #ccd3da;border-radius:5px;background:#fff;cursor:pointer}button.active{background:#263947;color:white}#view{display:block;width:100vw;height:calc(100vh - 220px)}#status{padding:8px 24px;background:white}label{margin-left:14px}footer{padding:6px 24px;font-size:13px}a{color:#305977;margin-right:13px}input[type=range]{vertical-align:middle;width:150px}#inventory{padding:18px 24px;background:white}#inventory:empty{display:none}#inventory h2{font-size:19px}#inventory h3{font-size:16px;margin-top:24px}table{border-collapse:collapse;width:100%;font-size:14px;margin:12px 0 24px}th,td{text-align:left;vertical-align:top;padding:10px;border-bottom:1px solid #dde3e8}th{background:#edf1f4}#mode-note{padding:10px 24px;background:#eaf0f4}#mode-note:empty{display:none}body.inventory #view{height:52vh}code{font-size:12px}@media(max-width:700px){#inventory{overflow-x:auto}th,td{min-width:110px}}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.180.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.180.0/examples/jsm/"}}</script></head><body>
<header><h1>Too Much Trash · R4 CAD review</h1><p>Six unique printable designs · seven pieces · measured 14 × 19 mm shaft · adjustable phone jaws</p><div id="modes"><button data-mode="phone" class="active">Phone assembly</button><button data-mode="full">Full tool</button><button data-mode="actuator">Actuator</button><button data-mode="parts">STL print set</button><button data-mode="hardware">Purchased hardware</button><label><input id="phone" type="checkbox" checked> Phone envelope</label><label>Lever stroke <input id="stroke" type="range" min="0" max="100" value="0"></label></div></header>
<div id="mode-note"></div><canvas id="view"></canvas><section id="inventory"></section><div id="status">Loading actual CAD exports…</div><footer id="links"></footer>
<script type="module">
import * as THREE from 'three';import {STLLoader} from 'three/addons/loaders/STLLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const canvas=document.querySelector('#view'),status=document.querySelector('#status');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0xf4f5f7);
const scene=new THREE.Scene();scene.add(new THREE.HemisphereLight(0xffffff,0x7e8995,2.6));const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(150,250,150);scene.add(light);
const camera=new THREE.PerspectiveCamera(36,1,.1,4000);const controls=new OrbitControls(camera,canvas);controls.enableDamping=true;
const root=new THREE.Group();root.rotation.x=-Math.PI/2;scene.add(root);const assembly=new THREE.Group(),prints=new THREE.Group(),hardwareSet=new THREE.Group();root.add(assembly,prints,hardwareSet);
const loader=new STLLoader();let mode='phone',manifest,loaded=0;const meshByName=new Map();let bomSections=[];
const moving=new THREE.Group();assembly.add(moving);const movable=new Set(['rocker','contact_M3','contact_locknut','contact_rear_locknut','soft_button_tip','cable_pinch_barrel','return_spring_moving_leg']);
function material(color){return new THREE.MeshStandardMaterial({color:new THREE.Color(...color),roughness:.65,metalness:.06});}
function load(url){return loader.loadAsync(url).then(g=>{g.computeVertexNormals();return g;});}
function label(text,x,y,z,parent=prints){const c=document.createElement('canvas');c.width=640;c.height=64;const ctx=c.getContext('2d');ctx.fillStyle='#263947';ctx.textAlign='center';ctx.font='30px system-ui';ctx.fillText(text,320,43);const m=new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false});const s=new THREE.Sprite(m);s.position.set(x,y,z);s.scale.set(110,11,1);parent.add(s);}
function allowed(name){if(mode==='full')return true;if(mode==='actuator')return /^(actuator_bracket|rocker|pivot|return_|contact_|soft_button|travel_|phone_inner|cable_pinch|carriage_)/.test(name);return !/^(stock_|handle_|housing_route|series_|trigger_|collar_M4_handle)/.test(name);}
function fit(){const box=new THREE.Box3();if(mode==='parts'||mode==='hardware'){const tray=mode==='parts'?prints:hardwareSet;tray.updateWorldMatrix(true,true);tray.traverse(o=>{if(o.isMesh)box.expandByObject(o);});}else{assembly.updateWorldMatrix(true,true);for(const [n,m] of meshByName)if(m.visible)box.expandByObject(m);}
const center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());controls.target.copy(center);
const inventory=['parts','hardware'].includes(mode);camera.up.set(0,inventory?0:1,inventory?-1:0);
if(inventory){const tangent=Math.tan(THREE.MathUtils.degToRad(18));const distance=Math.max((size.x+80)/camera.aspect,(size.z+85)*.84+size.y*.55)/2/tangent*1.12;camera.position.copy(center).add(new THREE.Vector3(0,1,.65).normalize().multiplyScalar(distance));}
else{const radius=Math.max(size.x,size.y,size.z)*.72;camera.position.copy(center).add(new THREE.Vector3(mode==='actuator'?0.3:1,mode==='full'?.25:.85,1.25).normalize().multiplyScalar(radius/Math.tan(THREE.MathUtils.degToRad(18))*1.12));}
camera.near=.1;camera.far=5000;camera.updateProjectionMatrix();controls.update();}

function update(refit=true){prints.visible=mode==='parts';hardwareSet.visible=mode==='hardware';assembly.visible=!['parts','hardware'].includes(mode);showInventory();resize();const ph=document.querySelector('#phone').checked;for(const [n,m] of meshByName){m.visible=allowed(n)&&(ph||!['phone_envelope','camera_keepout','phone_volume_up','phone_volume_down'].includes(n));m.material.transparent=mode==='actuator'&&n==='actuator_bracket';m.material.opacity=m.material.transparent?.35:1;m.material.depthWrite=!m.material.transparent;}
if(refit)fit();status.textContent=mode==='hardware'?'Purchased components · simplified CAD representatives, individually scaled for visibility · full quantities and materials below':`${manifest.parts.length} printable STL files loaded · ${manifest.parts.reduce((n,p)=>n+p.quantity,0)} printed pieces · drag to orbit, scroll to zoom. Fit prototype; physical validation required.`;}
function escapeHTML(s){return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');}
function formatted(s){return escapeHTML(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');}
function parseBOM(text){let title='',current;for(const line of text.split('\n')){if(line.startsWith('## ')){title=line.slice(3);current=null;}if(line.startsWith('|')){const cells=line.split('|').slice(1,-1).map(s=>s.trim());if(cells.every(s=>/^[-: ]+$/.test(s)))continue;if(!current){current={title,headers:cells,rows:[]};bomSections.push(current);}else current.rows.push(cells);}}}
function table(section){return `<h3>${escapeHTML(section.title)}</h3><table><thead><tr>${section.headers.map(c=>`<th>${formatted(c)}</th>`).join('')}</tr></thead><tbody>${section.rows.map(row=>`<tr>${row.map(c=>`<td>${formatted(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;}
function showInventory(){const inventory=['parts','hardware'].includes(mode);document.body.classList.toggle('inventory',inventory);document.querySelector('#phone').disabled=inventory;document.querySelector('#stroke').disabled=inventory;
const sections=mode==='parts'?bomSections.filter(s=>s.title==='Printed'):mode==='hardware'?bomSections.filter(s=>s.title!=='Printed'):[];
document.querySelector('#inventory').innerHTML=sections.map(table).join('');
document.querySelector('#mode-note').textContent=mode==='parts'?'Preferred materials: initial prototype PLA / PLA+ (PETG optional); later rigid parts PETG. TPU is reserved for separate soft accessories. Per-part recommendations below.':mode==='hardware'?'Purchased hardware and soft accessories. Gray models below are simplified representatives, not printable parts or supplier specifications. Items without models are included in the tables; future printable accessories are marked as proposed.':'';
}
try{parseBOM(await fetch('bom.md').then(r=>{if(!r.ok)throw new Error('Cannot load material BOM');return r.text();}));manifest=await fetch('print/manifest.json').then(r=>r.json());const pivot=new THREE.Vector3(...manifest.motion_pivot);moving.position.copy(pivot);
await Promise.all(manifest.assembly.map(async entry=>{const g=await load('print/'+entry.file);const m=new THREE.Mesh(g,material(entry.color));m.name=entry.name;if(movable.has(entry.name)){g.translate(-pivot.x,-pivot.y,-pivot.z);moving.add(m);}else assembly.add(m);meshByName.set(entry.name,m);loaded++;status.textContent=`Loading CAD: ${loaded}/${manifest.assembly.length}`;}));
await Promise.all(manifest.parts.map(async(entry,i)=>{const g=await load('print/'+entry.file);const m=new THREE.Mesh(g,material([.96,.36,.08]));const x=(i%3)*165,y=Math.floor(i/3)*185;m.position.set(x,y,0);prints.add(m);label(entry.name.replaceAll('_',' ')+` ×${entry.quantity}`,x+65,y-13,0);}));
const hardwareSamples=[['draw_screw_M4','Jaw draw screw'],['draw_screw_head','Thumb head'],['jaw_nut','Captive nut'],['collar_M4_phone_21.2','Collar bolt'],['carriage_M3_-8','Actuator bolt'],['pivot_M3','Pivot axle'],['contact_M3','Button contact screw'],['travel_stop_M3','Travel stop screw'],['cable_pinch_barrel','Cable stop'],['return_spring_coil','Return spring envelope'],['series_extension_spring_envelope','Extension spring envelope'],['phone_inner_wire','Inner wire'],['housing_route_0','Outer housing'],['soft_side_pad_left','Jaw pad'],['soft_button_tip','Soft contact tip'],['trigger_strap_envelope','Trigger strap envelope']];
for(const [i,[name,title]] of hardwareSamples.entries()){const source=meshByName.get(name);if(!source)throw new Error('Missing hardware representative: '+name);const g=source.geometry.clone();g.computeBoundingBox();const center=g.boundingBox.getCenter(new THREE.Vector3()),extent=g.boundingBox.getSize(new THREE.Vector3());g.translate(-center.x,-center.y,-center.z);const scale=55/Math.max(extent.x,extent.y,extent.z);g.scale(scale,scale,scale);const m=new THREE.Mesh(g,material([.47,.53,.59]));const x=(i%4)*140,y=Math.floor(i/4)*110;m.position.set(x,y,30);hardwareSet.add(m);label(title,x,y-42,0,hardwareSet);}
document.querySelector('#links').innerHTML=manifest.parts.map(p=>`<a href="print/${p.file}" download>${p.name} STL</a>`).join('')+'<a href="print/assembly.step" download>Assembly STEP</a>';
update();document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));update();});document.querySelector('#phone').onchange=()=>update(false);document.querySelector('#stroke').oninput=e=>{moving.rotation.y=manifest.motion_sign*manifest.pressed_angle_radians*Number(e.target.value)/100;};
}catch(e){status.textContent='Load failed: '+e.message;console.error(e);}
function resize(){renderer.setSize(canvas.clientWidth,canvas.clientHeight,false);camera.aspect=canvas.clientWidth/canvas.clientHeight;camera.updateProjectionMatrix();}window.addEventListener('resize',resize);resize();function frame(){requestAnimationFrame(frame);controls.update();renderer.render(scene,camera);}frame();
</script></body></html>
