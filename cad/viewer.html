<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Too Much Trash — R1 printable STLs</title>
  <style>
    body { margin: 0; font: 15px system-ui, sans-serif; color: #263340; background: #f7f8fa; }
    header { padding: 16px 24px 10px; }
    h1 { margin: 0 0 5px; font-size: 23px; }
    p { margin: 0; color: #566574; }
    #view { width: 100vw; height: calc(100vh - 106px); display: block; }
    #status { position: fixed; right: 22px; top: 22px; background: white; padding: 8px 12px;
              border-radius: 7px; box-shadow: 0 2px 9px #1d2e3b1a; }
  </style>
  <script type="importmap">
    {"imports":{"three":"https://unpkg.com/three@0.180.0/build/three.module.js",
                "three/addons/":"https://unpkg.com/three@0.180.0/examples/jsm/"}}
  </script>
</head>
<body>
  <header>
    <h1>Reacher retrofit — eight printable R1 STLs</h1>
    <p>Drag to rotate, scroll to zoom. Each orange mesh is loaded from its committed STL file. Fit values remain provisional.</p>
  </header>
  <div id="status">Loading…</div>
  <canvas id="view"></canvas>
  <script type="module">
    import * as THREE from 'three';
    import { STLLoader } from 'three/addons/loaders/STLLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const names = ['carrier_frame', 'movable_rail', 'neck_saddle', 'neck_cap',
                   'button_lever', 'handle_anchor_saddle', 'handle_anchor_cap', 'trigger_tab'];
    const canvas = document.getElementById('view');
    const status = document.getElementById('status');
    const renderer = new THREE.WebGLRenderer({canvas, antialias: true});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0xf7f8fa);
    const scene = new THREE.Scene();
    scene.add(new THREE.AmbientLight(0xffffff, 2.2));
    const key = new THREE.DirectionalLight(0xffffff, 2.5);
    key.position.set(-100, 140, 220);
    scene.add(key);
    const fill = new THREE.DirectionalLight(0xffffff, 1.2);
    fill.position.set(120, -80, 80);
    scene.add(fill);

    const camera = new THREE.OrthographicCamera(-190, 190, 110, -110, 1, 1000);
    camera.position.set(50, -90, 350);
    camera.lookAt(0, 0, 0);
    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.target.set(0, 0, 0);
    const loader = new STLLoader();
    const material = new THREE.MeshStandardMaterial({color: 0xf26a18, metalness: .08, roughness: .72,
                                                      side: THREE.DoubleSide});

    function label(name, x, y) {
      const c = document.createElement('canvas'); c.width = 512; c.height = 64;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#263340'; ctx.font = 'bold 30px system-ui';
      ctx.textAlign = 'center'; ctx.fillText(name.replaceAll('_', ' '), 256, 42);
      const texture = new THREE.CanvasTexture(c);
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({map: texture, transparent: true}));
      sprite.position.set(x, y-40, 0);
      sprite.scale.set(72, 9, 1);
      scene.add(sprite);
    }

    let loaded = 0;
    names.forEach((name, index) => {
      const x = (index % 4 - 1.5) * 88;
      const y = (0.5 - Math.floor(index / 4)) * 100;
      label(name, x, y);
      loader.load(`print/${name}.stl`, geometry => {
        geometry.computeVertexNormals();
        geometry.computeBoundingBox();
        const size = new THREE.Vector3();
        geometry.boundingBox.getSize(size);
        geometry.center();
        geometry.scale(66 / Math.max(size.x, size.y, size.z),
                        66 / Math.max(size.x, size.y, size.z),
                        66 / Math.max(size.x, size.y, size.z));
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.set(x, y+4, 0);
        scene.add(mesh);
        loaded += 1;
        status.textContent = `${loaded} / ${names.length} STL files loaded`;
      }, undefined, error => {
        status.textContent = `Could not load ${name}.stl`;
        console.error(error);
      });
    });

    function resize() {
      const width = canvas.clientWidth, height = canvas.clientHeight;
      renderer.setSize(width, height, false);
      const aspect = width / height;
      camera.left = -190; camera.right = 190;
      camera.top = 190/aspect; camera.bottom = -190/aspect;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();
    function frame() { requestAnimationFrame(frame); controls.update(); renderer.render(scene, camera); }
    frame();
  </script>
</body>
</html>
