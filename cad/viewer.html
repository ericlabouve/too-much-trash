<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Too Much Trash — R4 CAD and STL review</title>
<style>body{margin:0;font:15px system-ui;color:#23303b;background:#f4f5f7}header{padding:18px 24px;background:white;border-bottom:1px solid #d9dfe3}h1{font-size:22px;margin:0 0 7px}p{margin:4px 0;color:#586674}button,a{font:inherit}button{padding:8px 13px;margin:9px 6px 0 0;border:1px solid #ccd3da;border-radius:5px;background:#fff;cursor:pointer}button.active{background:#263947;color:white}#view{display:block;width:100vw;height:calc(100vh - 220px)}#status{padding:8px 24px;background:white}label{margin-left:14px}footer{padding:6px 24px;font-size:13px}a{color:#305977;margin-right:13px}input[type=range]{vertical-align:middle;width:150px}#inventory{padding:18px 24px;background:white}#inventory:empty{display:none}#inventory h2{font-size:19px}#inventory h3{font-size:16px;margin-top:24px}table{border-collapse:collapse;width:100%;font-size:14px;margin:12px 0 24px}th,td{text-align:left;vertical-align:top;padding:10px;border-bottom:1px solid #dde3e8}th{background:#edf1f4}#mode-note{padding:10px 24px;background:#eaf0f4}#mode-note:empty{display:none}body.inventory #view{height:52vh}code{font-size:12px}@media(max-width:700px){#inventory{overflow-x:auto}th,td{min-width:110px}}
#material-controls{padding:14px 24px;background:white;border-bottom:1px solid #d9dfe3}#material-controls[hidden]{display:none}#material-controls fieldset{display:inline-block;margin:0 22px 10px 0;padding:10px 14px;border:1px solid #d4dce3;border-radius:6px}#material-controls legend{padding:0 6px;font-weight:600}#material-controls label{display:inline-block;margin:0 18px 0 0}#material-controls input{accent-color:#197d83}#material-controls fieldset:disabled{opacity:.5}.swatch{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px}.material-tag{font-weight:600}#material-legend{font-size:13px;margin-top:10px}#material-legend span{margin-right:15px}#strategy-summary{font-size:14px;margin-top:5px}
tr[data-row-id]{cursor:pointer}tr[data-row-id]:hover{background:#f2f7f9}tr.selected{background:#fff4ce}tr[data-row-id]:focus-visible{outline:2px solid #197d83}#component-menu{position:fixed;z-index:20;background:white;border:1px solid #bbc5ce;border-radius:8px;box-shadow:0 8px 30px #22334433;padding:12px;max-width:320px}#component-menu[hidden]{display:none}#component-menu strong{display:block;overflow-wrap:anywhere}#component-menu button{display:block;width:100%;text-align:left;margin-top:6px}#component-menu button:disabled{opacity:.45;cursor:default}#selection-bar{padding:5px 24px;background:white}#selection-info{margin-left:10px;font-size:14px}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.180.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.180.0/examples/jsm/"}}</script></head><body>
<header><h1>Too Much Trash · R4 CAD review</h1><p>Six unique printable designs · seven pieces · measured 14 × 19 mm shaft · adjustable phone jaws</p><div id="modes"><button data-mode="phone" class="active">Phone assembly</button><button data-mode="full">Full tool</button><button data-mode="actuator">Actuator</button><button data-mode="bom">Bill of Materials</button><label><input id="phone" type="checkbox" checked> Phone envelope</label><label>Lever stroke <input id="stroke" type="range" min="0" max="100" value="0"></label></div></header>
<div id="mode-note"></div><section id="material-controls" hidden>
<fieldset id="available-materials"><legend>Preferred materials on hand</legend><label><input type="checkbox" name="available" value="pla" checked> PLA/PLA+</label><label><input type="checkbox" name="available" value="petg" checked> PETG</label><label><input type="checkbox" name="available" value="tpu"> TPU</label></fieldset>
<label><input id="optimal-layout" type="checkbox" role="switch"> Most Optimal Layout</label>
<p id="strategy-summary" aria-live="polite"></p><div id="material-legend"></div></section><div id="selection-bar"><button id="show-all">Show all</button><span id="selection-info" role="status"></span></div><div id="component-menu" role="menu" hidden></div><canvas id="view"></canvas><section id="inventory"></section><div id="status">Loading actual CAD exports…</div><footer id="links"></footer>
<script type="module">
import {installNavigation,assemblyNames} from './component_navigation.js';
import {strategy,palette} from './material_strategy.js';
import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';
import * as THREE from 'three';import {STLLoader} from 'three/addons/loaders/STLLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const canvas=document.querySelector('#view'),status=document.querySelector('#status');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0xf4f5f7);
const scene=new THREE.Scene();scene.add(new THREE.HemisphereLight(0xffffff,0x7e8995,2.6));const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(150,250,150);scene.add(light);
const camera=new THREE.PerspectiveCamera(36,1,.1,4000);const controls=new OrbitControls(camera,canvas);controls.enableDamping=true;
const root=new THREE.Group();root.rotation.x=-Math.PI/2;scene.add(root);const assembly=new THREE.Group(),prints=new THREE.Group(),hardwareSet=new THREE.Group();root.add(assembly,prints,hardwareSet);
const loader=new STLLoader();let mode='phone',manifest,loaded=0;const meshByName=new Map();let bomSections=[];const bomMeshes=[];let navigation;
const moving=new THREE.Group(),triggerMoving=new THREE.Group();assembly.add(moving,triggerMoving);const movable=new Set(['rocker','contact_M3','contact_locknut','contact_rear_locknut','soft_button_tip','cable_pinch_barrel','return_spring_moving_leg']);
function material(color){return new THREE.MeshStandardMaterial({color:new THREE.Color(...color),roughness:.65,metalness:.06});}
function load(url){return loader.loadAsync(url).then(g=>{g.computeVertexNormals();return g;});}
function label(text,x,y,z,parent=prints){const c=document.createElement('canvas');c.width=640;c.height=64;const ctx=c.getContext('2d');ctx.fillStyle='#263947';ctx.textAlign='center';ctx.font='30px system-ui';ctx.fillText(text,320,43);const m=new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false});const s=new THREE.Sprite(m);s.position.set(x,y,z);s.scale.set(110,11,1);parent.add(s);}
function allowed(name,view=mode){if(view==='full')return true;if(view==='actuator')return /^(actuator_bracket|rocker|pivot|return_|contact_|soft_button|travel_|phone_inner|phone_ferrule|cable_pinch|carriage_)/.test(name);return !/^(stock_|handle_|housing_route|series_|trigger_|collar_M4_handle)/.test(name);}
function fit(){const box=new THREE.Box3();if(mode==='bom'){for(const tray of [prints,hardwareSet]){tray.updateWorldMatrix(true,true);tray.traverse(o=>{if(o.isMesh)box.expandByObject(o);});}}else{assembly.updateWorldMatrix(true,true);for(const [n,m] of meshByName)if(m.visible)box.expandByObject(m);}
const center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());controls.target.copy(center);
const inventory=(mode==='bom');camera.up.set(0,inventory?0:1,inventory?-1:0);
if(inventory){const tangent=Math.tan(THREE.MathUtils.degToRad(18));const distance=Math.max((size.x+80)/camera.aspect,(size.z+85)*.84+size.y*.55)/2/tangent*1.12;camera.position.copy(center).add(new THREE.Vector3(0,1,.65).normalize().multiplyScalar(distance));}
else{const radius=Math.max(size.x,size.y,size.z)*.72;camera.position.copy(center).add(new THREE.Vector3(mode==='actuator'?0.3:1,mode==='full'?.25:.85,1.25).normalize().multiplyScalar(radius/Math.tan(THREE.MathUtils.degToRad(18))*1.12));}
camera.near=.1;camera.far=5000;camera.updateProjectionMatrix();controls.update();}

function update(refit=true){prints.visible=mode==='bom';hardwareSet.visible=mode==='bom';assembly.visible=!(mode==='bom');showInventory();resize();const ph=document.querySelector('#phone').checked;for(const [n,m] of meshByName){m.visible=allowed(n)&&(ph||!['phone_envelope','camera_keepout','phone_volume_up','phone_volume_down'].includes(n));m.material.transparent=mode==='actuator'&&n==='actuator_bracket';m.material.opacity=m.material.transparent?.35:1;m.material.depthWrite=!m.material.transparent;}
if(refit)fit();status.textContent=mode==='bom'?'Colors show material recommendations; models do not change shape. Hardware is individually scaled for visibility. Use table quantities, not the number of model examples.':`${mode==='full'?'Trigger pivot and squeeze are illustrative; spring stretches after actuator reaches its stop. · ':''}${manifest.parts.length} printable STL files loaded · ${manifest.parts.reduce((n,p)=>n+p.quantity,0)} printed pieces · drag to orbit, scroll to zoom. Fit prototype; physical validation required.`;}
function escapeHTML(s){return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');}
function formatted(s){return escapeHTML(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');}
function parseBOM(text){let title='',current;for(const line of text.split('\n')){if(line.startsWith('## ')){title=line.slice(3);current=null;}if(line.startsWith('|')){const cells=line.split('|').slice(1,-1).map(s=>s.trim());if(cells.every(s=>/^[-: ]+$/.test(s)))continue;if(!current){current={title,headers:cells,rows:[]};bomSections.push(current);}else current.rows.push(cells);}}}
function choices(){return {available:[...document.querySelectorAll('[name="available"]:checked')].map(el=>el.value),optimal:document.querySelector('#optimal-layout').checked};}
function recommendation(row){const c=choices();return strategy(row,c.available,c.optimal);}
function table(section){const headers=['Component / file','Quantity','Need','3D model','Material','Purpose and counting notes'];return `<h3>${escapeHTML(section.title)}</h3><table><thead><tr>${headers.map(c=>`<th>${formatted(c)}</th>`).join('')}</tr></thead><tbody>${section.rows.map(row=>{const choice=recommendation(row);return `<tr data-row-id="${bomSections.flatMap(s=>s.rows).indexOf(row)}" tabindex="0" aria-selected="false"><td>${formatted(row[0])}</td><td>${formatted(row[1])}</td><td>${formatted(row[2])}</td><td>${row[0].startsWith('`print/')?'Printable STL':bomMeshes.some(e=>e.rowName===row[0])?'Reference only; not a printable STL':'Not modeled — table only'}</td><td><span class="swatch" style="background:${palette[choice.key]}"></span>${formatted(choice.text)}</td><td>${formatted(row[5])}</td></tr>`;}).join('')}</tbody></table>`;}
function refreshStrategy(){const {optimal,available}=choices();document.querySelector('#available-materials').disabled=optimal;
const rows=bomSections.flatMap(s=>s.rows);for(const {mesh,rowName} of bomMeshes){const row=rows.find(r=>r[0]===rowName);if(row)mesh.material.color.set(palette[recommendation(row).key]);}
document.querySelector('#inventory').innerHTML=bomSections.map(table).join('');navigation?.refreshRows();
document.querySelector('#strategy-summary').textContent=optimal?'Recommended assignment: PETG rigid parts + TPU soft accessories. Conventional metal hardware and textiles remain. Planned accessories still need printable designs.':`Using your checked materials. ${available.includes('petg')?'PETG takes priority for rigid parts; uncheck it to use PLA/PLA+.':available.includes('pla')?'PLA/PLA+ is selected for the initial rigid prototype.':'No suitable rigid filament selected: obtain PETG or externally printed rigid parts.'} ${available.includes('tpu')?'TPU accessories are planned, not yet exported.':'Use purchased compliant pads and caps.'}`;
document.querySelector('#material-legend').innerHTML=Object.entries({pla:'PLA / PLA+',petg:'PETG',tpu:'TPU · planned soft parts',brake:'Brake cable components · purchased',buy:'Other purchased hardware / soft goods',missing:'Missing rigid material'}).map(([key,title])=>`<span><i class="swatch" style="background:${palette[key]}"></i>${title}</span>`).join('');
}

function showInventory(){const inventory=(mode==='bom');document.body.classList.toggle('inventory',inventory);document.querySelector('#phone').disabled=inventory;document.querySelector('#stroke').disabled=inventory;
document.querySelector('#material-controls').hidden=!inventory;if(inventory)refreshStrategy();else document.querySelector('#inventory').innerHTML='';
document.querySelector('#mode-note').textContent=inventory?'One item per row. Choose materials on hand or the recommended assignment. Colors apply to this BOM view only; material choices do not change geometry. Hardware models are illustrative. Shaft liners, trigger saddle and cable-retaining loops are table-only: no CAD models yet. Purple marks existing TPU candidate references, not completed TPU STL designs.':'';
}
try{parseBOM(await fetch('bom.md').then(r=>{if(!r.ok)throw new Error('Cannot load material BOM');return r.text();}));manifest=await fetch('print/manifest.json').then(r=>r.json());const pivot=new THREE.Vector3(...manifest.motion_pivot);moving.position.copy(pivot);const triggerPivot=new THREE.Vector3(...manifest.trigger_motion.pivot);triggerMoving.position.copy(triggerPivot);
await Promise.all(manifest.assembly.map(async entry=>{const g=await load('print/'+entry.file);const m=new THREE.Mesh(g,material(entry.color));m.name=entry.name;if(movable.has(entry.name)){g.translate(-pivot.x,-pivot.y,-pivot.z);moving.add(m);}else if(['stock_black_trigger','trigger_strap_envelope'].includes(entry.name)){g.translate(-triggerPivot.x,-triggerPivot.y,-triggerPivot.z);triggerMoving.add(m);}else assembly.add(m);meshByName.set(entry.name,m);loaded++;status.textContent=`Loading CAD: ${loaded}/${manifest.assembly.length}`;}));
await Promise.all(manifest.parts.map(async(entry,i)=>{const g=await load('print/'+entry.file);const m=new THREE.Mesh(g,material([.96,.36,.08]));const x=(i%3)*165,y=Math.floor(i/3)*185;m.position.set(x,y,0);prints.add(m);bomMeshes.push({mesh:m,rowName:'`print/'+entry.file+'`'});label(entry.name.replaceAll('_',' ')+` ×${entry.quantity}`,x+65,y-13,0);}));
const hardwareSamples=[['draw_screw_M4','Draw screw incl. thumb head'],['jaw_nut','Captive nut'],['collar_M4_phone_21.2','Collar bolt'],['carriage_M3_-8','Actuator bolt'],['pivot_M3','Pivot axle'],['contact_M3','Button contact screw'],['travel_stop_M3','Travel stop screw'],['cable_pinch_barrel','Cable stop'],['return_spring_coil','Torsion return spring'],['series_extension_spring_envelope','Extension spring with eyes'],['phone_inner_wire','Inner wire'],['phone_ferrule','Housing ferrule'],['housing_route_0','Outer housing'],['soft_side_pad_left','Side jaw pad'],['soft_rear_pad_left','Rear jaw pad'],['soft_button_tip','Soft contact tip'],['trigger_strap_envelope','Trigger strap envelope']];
hardwareSet.position.x=600;
for(const [i,[name,title]] of hardwareSamples.entries()){const source=meshByName.get(name);if(!source)throw new Error('Missing hardware representative: '+name);const grouped={draw_screw_M4:['draw_screw_M4','draw_screw_head'],return_spring_coil:['return_spring_coil','return_spring_fixed_leg','return_spring_moving_leg'],contact_M3:['contact_M3','contact_locknut','contact_rear_locknut']};const pieces=(grouped[name]||[name]).map(n=>{const geo=meshByName.get(n).geometry.clone();if(movable.has(n))geo.translate(pivot.x,pivot.y,pivot.z);return geo;});const g=mergeGeometries(pieces.map(geo=>geo.index?geo.toNonIndexed():geo));pieces.forEach(geo=>geo.dispose());g.computeBoundingBox();const center=g.boundingBox.getCenter(new THREE.Vector3()),extent=g.boundingBox.getSize(new THREE.Vector3());g.translate(-center.x,-center.y,-center.z);const scale=55/Math.max(extent.x,extent.y,extent.z);g.scale(scale,scale,scale);const m=new THREE.Mesh(g,material([.47,.53,.59]));const x=(i%4)*140,y=Math.floor(i/4)*110;m.position.set(x,y,30);hardwareSet.add(m);const row=bomSections.flatMap(s=>s.rows).find(row=>assemblyNames(row,meshByName).includes(name));if(row)bomMeshes.push({mesh:m,rowName:row[0]});label(title,x,y-42,0,hardwareSet);}
document.querySelector('#links').innerHTML=manifest.parts.map(p=>`<a href="print/${p.file}" download>${p.name} STL</a>`).join('')+'<a href="print/assembly.step" download>Assembly STEP</a>';
document.querySelectorAll('[name="available"],#optimal-layout').forEach(el=>el.onchange=refreshStrategy);
function setMode(view){mode=view;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x.dataset.mode===view));update();}
navigation=installNavigation({THREE,scene,camera,controls,canvas,bomMeshes,meshByName,rows:bomSections.flatMap(s=>s.rows),getMode:()=>mode,setMode,allowed});
update();document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{navigation.clear();setMode(b.dataset.mode);});document.querySelector('#phone').onchange=()=>update(false);const tm=manifest.trigger_motion,axisY=new THREE.Vector3(0,1,0),anchor=new THREE.Vector3(...tm.housing_exit),attachRest=new THREE.Vector3(...tm.attach);
const restDistance=anchor.distanceTo(attachRest),wireLength=restDistance-tm.spring_free_length;
function rodBetween(name,a,b,diameter){const mesh=meshByName.get(name);if(!mesh.userData.dynamicRod){mesh.geometry.dispose();const strands=[];for(let i=0;i<7;i++){const strand=new THREE.CylinderGeometry(diameter/6,diameter/6,1,10);if(i)strand.translate(diameter/3*Math.cos((i-1)*Math.PI/3),0,diameter/3*Math.sin((i-1)*Math.PI/3));strands.push(strand);}mesh.geometry=mergeGeometries(strands);strands.forEach(g=>g.dispose());mesh.userData.dynamicRod=true;}const vector=b.clone().sub(a);mesh.position.copy(a).add(b).multiplyScalar(.5);mesh.scale.set(1,vector.length(),1);mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),vector.normalize());}
function springBetween(a,b){
const mesh=meshByName.get('series_extension_spring_envelope'),vector=b.clone().sub(a),length=vector.length(),wire=.8,radius=(manifest.parameters.spring_od-wire)/2,lead=6,eye=2.5;
class Helix extends THREE.Curve{getPoint(t,target=new THREE.Vector3()){const angle=24*2*Math.PI*t;return target.set(radius*Math.cos(angle),radius*Math.sin(angle),lead+(length-2*lead)*t);}}
const pieces=[new THREE.TubeGeometry(new Helix(),576,wire/2,8,false)];
for(const z of [eye,length-eye]){const ring=new THREE.TorusGeometry(eye,wire/2,8,48);ring.rotateX(Math.PI/2);ring.translate(0,0,z);pieces.push(ring);}
for(const [start,end] of [[[eye,0,eye],[radius,0,lead]],[[radius,0,length-lead],[eye,0,length-eye]]])pieces.push(new THREE.TubeGeometry(new THREE.LineCurve3(new THREE.Vector3(...start),new THREE.Vector3(...end)),1,wire/2,8,false));
const geometry=mergeGeometries(pieces);pieces.forEach(g=>g.dispose());mesh.geometry.dispose();mesh.geometry=geometry;mesh.position.copy(a);mesh.scale.set(1,1,1);mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),vector.normalize());
}
function squeeze(fraction){triggerMoving.rotation.y=tm.angle_radians*fraction;
const attach=attachRest.clone().sub(triggerPivot).applyAxisAngle(axisY,triggerMoving.rotation.y).add(triggerPivot);
const direction=attach.clone().sub(anchor).normalize(),springStart=anchor.clone().addScaledVector(direction,wireLength);
rodBetween('handle_inner_wire',anchor,springStart,1.6);springBetween(springStart,attach);
// Prescribed take-up: the small phone lever reaches its stop early; the series spring absorbs remaining squeeze.
const takeUp=Math.max(0,anchor.distanceTo(attach)-restDistance),leverFraction=Math.min(1,takeUp/1.0);
moving.rotation.y=manifest.motion_sign*manifest.pressed_angle_radians*leverFraction;
const wireStart=new THREE.Vector3(...manifest.phone_wire[0]),wireEnd=new THREE.Vector3(...manifest.phone_wire[1]).sub(pivot).applyAxisAngle(axisY,moving.rotation.y).add(pivot);
rodBetween('phone_inner_wire',wireStart,wireEnd,1.6);
}
document.querySelector('#stroke').oninput=e=>squeeze(Number(e.target.value)/100);squeeze(Number(document.querySelector('#stroke').value)/100);
}catch(e){status.textContent='Load failed: '+e.message;console.error(e);}
function resize(){renderer.setSize(canvas.clientWidth,canvas.clientHeight,false);camera.aspect=canvas.clientWidth/canvas.clientHeight;camera.updateProjectionMatrix();}window.addEventListener('resize',resize);resize();function frame(){requestAnimationFrame(frame);controls.update();navigation?.tick();renderer.render(scene,camera);}frame();
</script></body></html>
