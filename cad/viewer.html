<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Too Much Trash — R4 CAD and STL review</title>
<style>body{margin:0;font:15px system-ui;color:#23303b;background:#f4f5f7}header{padding:18px 24px;background:white;border-bottom:1px solid #d9dfe3}h1{font-size:22px;margin:0 0 7px}p{margin:4px 0;color:#586674}button,a{font:inherit}button{padding:8px 13px;margin:9px 6px 0 0;border:1px solid #ccd3da;border-radius:5px;background:#fff;cursor:pointer}button.active{background:#263947;color:white}#view{display:block;width:100vw;height:calc(100vh - 220px)}#status{padding:8px 24px;background:white}label{margin-left:14px}footer{padding:6px 24px;font-size:13px}a{color:#305977;margin-right:13px}input[type=range]{vertical-align:middle;width:150px}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.180.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.180.0/examples/jsm/"}}</script></head><body>
<header><h1>Too Much Trash · R4 CAD review</h1><p>Six unique printable designs · seven pieces · measured 14 × 19 mm shaft · adjustable phone jaws</p><div id="modes"><button data-mode="phone" class="active">Phone assembly</button><button data-mode="full">Full tool</button><button data-mode="actuator">Actuator</button><button data-mode="parts">STL print set</button><label><input id="phone" type="checkbox" checked> Phone envelope</label><label>Lever stroke <input id="stroke" type="range" min="0" max="100" value="0"></label></div></header>
<canvas id="view"></canvas><div id="status">Loading actual CAD exports…</div><footer id="links"></footer>
<script type="module">
import * as THREE from 'three';import {STLLoader} from 'three/addons/loaders/STLLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const canvas=document.querySelector('#view'),status=document.querySelector('#status');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0xf4f5f7);
const scene=new THREE.Scene();scene.add(new THREE.HemisphereLight(0xffffff,0x7e8995,2.6));const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(150,250,150);scene.add(light);
const camera=new THREE.PerspectiveCamera(36,1,.1,4000);const controls=new OrbitControls(camera,canvas);controls.enableDamping=true;
const root=new THREE.Group();root.rotation.x=-Math.PI/2;scene.add(root);const assembly=new THREE.Group(),prints=new THREE.Group();root.add(assembly,prints);
const loader=new STLLoader();let mode='phone',manifest,loaded=0;const meshByName=new Map();
const moving=new THREE.Group();assembly.add(moving);const movable=new Set(['rocker','contact_M3','contact_locknut','contact_rear_locknut','soft_button_tip','cable_pinch_barrel','return_spring_moving_leg']);
function material(color){return new THREE.MeshStandardMaterial({color:new THREE.Color(...color),roughness:.65,metalness:.06});}
function load(url){return loader.loadAsync(url).then(g=>{g.computeVertexNormals();return g;});}
function label(text,x,y,z){const c=document.createElement('canvas');c.width=640;c.height=64;const ctx=c.getContext('2d');ctx.fillStyle='#263947';ctx.textAlign='center';ctx.font='30px system-ui';ctx.fillText(text,320,43);const m=new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false});const s=new THREE.Sprite(m);s.position.set(x,y,z);s.scale.set(110,11,1);prints.add(s);}
function allowed(name){if(mode==='full')return true;if(mode==='actuator')return /^(actuator_bracket|rocker|pivot|return_|contact_|soft_button|travel_|phone_inner|cable_pinch|carriage_)/.test(name);return !/^(stock_|handle_|housing_route|series_|trigger_|collar_M4_handle)/.test(name);}
function fit(){const box=new THREE.Box3();if(mode==='parts'){prints.updateWorldMatrix(true,true);prints.traverse(o=>{if(o.isMesh)box.expandByObject(o);});}else{assembly.updateWorldMatrix(true,true);for(const [n,m] of meshByName)if(m.visible)box.expandByObject(m);}
const center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());const radius=Math.max(size.x,size.y,size.z)*.72;controls.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(mode==='actuator'?0.3:1,mode==='full'?.25:.85,1.25).normalize().multiplyScalar(radius/Math.tan(THREE.MathUtils.degToRad(18))*1.12));camera.near=.1;camera.far=5000;camera.updateProjectionMatrix();controls.update();}
function update(refit=true){prints.visible=mode==='parts';assembly.visible=mode!=='parts';const ph=document.querySelector('#phone').checked;for(const [n,m] of meshByName){m.visible=allowed(n)&&(ph||!['phone_envelope','camera_keepout'].includes(n));m.material.transparent=mode==='actuator'&&n==='actuator_bracket';m.material.opacity=m.material.transparent?.35:1;m.material.depthWrite=!m.material.transparent;}
if(refit)fit();status.textContent=`${manifest.parts.length} printable STL files loaded · ${manifest.parts.reduce((n,p)=>n+p.quantity,0)} printed pieces · drag to orbit, scroll to zoom. Fit prototype; physical validation required.`;}
try{manifest=await fetch('print/manifest.json').then(r=>r.json());const pivot=new THREE.Vector3(...manifest.motion_pivot);moving.position.copy(pivot);
await Promise.all(manifest.assembly.map(async entry=>{const g=await load('print/'+entry.file);const m=new THREE.Mesh(g,material(entry.color));m.name=entry.name;if(movable.has(entry.name)){g.translate(-pivot.x,-pivot.y,-pivot.z);moving.add(m);}else assembly.add(m);meshByName.set(entry.name,m);loaded++;status.textContent=`Loading CAD: ${loaded}/${manifest.assembly.length}`;}));
await Promise.all(manifest.parts.map(async(entry,i)=>{const g=await load('print/'+entry.file);const m=new THREE.Mesh(g,material([.96,.36,.08]));const x=(i%3)*165,y=Math.floor(i/3)*185;m.position.set(x,y,0);prints.add(m);label(entry.name.replaceAll('_',' ')+` ×${entry.quantity}`,x+65,y-13,0);}));
document.querySelector('#links').innerHTML=manifest.parts.map(p=>`<a href="print/${p.file}" download>${p.name} STL</a>`).join('')+'<a href="print/assembly.step" download>Assembly STEP</a>';
update();document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));update();});document.querySelector('#phone').onchange=()=>update(false);document.querySelector('#stroke').oninput=e=>{moving.rotation.y=manifest.motion_sign*manifest.pressed_angle_radians*Number(e.target.value)/100;};
}catch(e){status.textContent='Load failed: '+e.message;console.error(e);}
function resize(){renderer.setSize(canvas.clientWidth,canvas.clientHeight,false);camera.aspect=canvas.clientWidth/canvas.clientHeight;camera.updateProjectionMatrix();}window.addEventListener('resize',resize);resize();function frame(){requestAnimationFrame(frame);controls.update();renderer.render(scene,camera);}frame();
</script></body></html>
