<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin access · Too Much Trash</title>
  <style>
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #eef3e9; color: #18332c; font: 16px system-ui, sans-serif; }
    main { width: min(28rem, calc(100% - 3rem)); padding: 2rem; background: white; border-radius: 1rem; box-shadow: 0 1rem 3rem #18332c18; }
    h1 { margin-top: 0; }
    label, input, button { display: block; width: 100%; box-sizing: border-box; }
    input { margin: .5rem 0 1rem; padding: .75rem; border: 1px solid #9eb7a4; border-radius: .4rem; }
    button { padding: .75rem; border: 0; border-radius: .4rem; background: #245943; color: white; font: inherit; cursor: pointer; }
    .token-field { position: relative; }
    .token-field input { padding-right: 3.5rem; }
    #toggle-token { position: absolute; right: .35rem; top: .35rem; width: 2.5rem; height: 2.5rem; padding: .5rem; background: transparent; color: #245943; }
    #toggle-token svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2; }
    #toggle-token[aria-pressed="false"] .eye-slash { display: none; }
    #toggle-token:focus-visible { outline: 2px solid #245943; outline-offset: 2px; }
    p { line-height: 1.5; }
    #message { min-height: 1.5em; color: #a1322b; }
  </style>
</head>
<body>
  <main>
    <h1>Admin access</h1>
    <p>Enter the token minted on the backend host. This temporary gate will be replaced by account sign-in.</p>
    <form id="unlock-form">
      <label for="token">Admin token</label>
      <div class="token-field">
        <input id="token" type="password" autocomplete="off" required>
        <button id="toggle-token" type="button" aria-label="Show token" title="Show token" aria-controls="token" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="m3 3 18 18"/></svg>
        </button>
      </div>
      <button type="submit">Open portal</button>
    </form>
    <p id="message" role="alert"></p>
  </main>
  <script>
    const tokenInput = document.querySelector('#token');
    const toggleToken = document.querySelector('#toggle-token');
    function setTokenVisible(visible) {
      tokenInput.type = visible ? 'text' : 'password';
      toggleToken.setAttribute('aria-pressed', String(visible));
      toggleToken.setAttribute('aria-label', visible ? 'Hide token' : 'Show token');
      toggleToken.title = visible ? 'Hide token' : 'Show token';
    }
    toggleToken.addEventListener('click', () => setTokenVisible(tokenInput.type === 'password'));
    document.querySelector('#unlock-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      setTokenVisible(false);
      const input = document.querySelector('#token');
      const message = document.querySelector('#message');
      message.textContent = '';
      const response = await fetch('/api/v1/admin/session', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        // Generated tokens have no whitespace; Safari autofill may add padding.
        body: JSON.stringify({token: input.value.trim()})
      });
      input.value = '';
      if (response.ok) location.replace('/');
      else message.textContent = 'Invalid token. Check the local token file.';
    });
  </script>
</body>
</html>
