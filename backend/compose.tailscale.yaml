# Opt-in overlay. No public Funnel is enabled by the committed configuration.
# docker compose -f compose.yaml -f compose.tailscale.yaml up --build -d
services:
  caddy:
    ports: !reset []
    environment:
      SITE_ADDRESS: ":80"
      ADMIN_SITE_ADDRESS: ":8081"
      API_SITE_ADDRESS: ":8082"
  api:
    environment:
      ADMIN_COOKIE_SECURE: "true"
  tailscale:
    image: ${TAILSCALE_IMAGE:-tailscale/tailscale:stable}
    network_mode: service:caddy
    environment:
      TS_HOSTNAME: ${TAILSCALE_HOSTNAME:-tmt-v1}
      TS_USERSPACE: "true"
      TS_ACCEPT_DNS: "false"
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./tailscale:/config:ro
    depends_on:
      caddy:
        condition: service_started
    restart: unless-stopped
volumes:
  tailscale_state:
