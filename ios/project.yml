name: TooMuchTrash
options:
  bundleIdPrefix: org.toomuchtrash
  deploymentTarget:
    iOS: "17.2"
targets:
  TooMuchTrash:
    type: application
    platform: iOS
    sources:
      - TooMuchTrash
    dependencies:
      - target: TooMuchTrashWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.toomuchtrash.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Info.plist
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSCameraUsageDescription: Record litter pickup attempts for review and research.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIFileSharingEnabled: NO
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: NO
      configs:
        Debug:
          "INFOPLIST_FILE[sdk=iphonesimulator*]": SimulatorDebugInfo.plist
  TooMuchTrashWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - TooMuchTrashWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.toomuchtrash.app.watchkitapp
        INFOPLIST_KEY_CFBundleDisplayName: TooMuchTrash
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: TooMuchTrashWatch/TooMuchTrashWatch.entitlements
        INFOPLIST_KEY_NSHealthShareUsageDescription: Support your cleanup walking workout on Apple Watch.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Save cleanup walks as outdoor walking workouts in Health.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: TooMuchTrashWatch/Info.plist
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: org.toomuchtrash.app
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: "4"
  TooMuchTrashTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TooMuchTrashTests
    dependencies:
      - target: TooMuchTrash
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  TooMuchTrashUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - TooMuchTrashUITests
    dependencies:
      - target: TooMuchTrash
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TooMuchTrash:
    build:
      targets:
        TooMuchTrash: all
    test:
      targets:
        - TooMuchTrashTests
        - TooMuchTrashUITests

  TooMuchTrashWatch:
    build:
      targets:
        TooMuchTrashWatch: all
