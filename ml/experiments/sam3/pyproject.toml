[project]
name = "too-much-trash-sam3-lab"
version = "0.1.0"
description = "SAM 3 image segmentation experiments for egocentric litter footage"
requires-python = ">=3.12"
dependencies = [
  "gradio>=5,<7",
  "huggingface-hub>=0.34,<2",
  "numpy>=1.26,<3",
  "pillow>=10,<13",
  "torch>=2.7,<3",
  "transformers>=4.57,<6",
]

[project.scripts]
sam3-viewer = "sam3_lab.viewer:main"
sam3-download = "sam3_lab.download:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sam3_lab"]
